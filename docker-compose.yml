version: '3.8'

services:
  app:
    build: .
    container_name: private_chat_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=/app/data/chat.db
      - UPLOAD_DIR=/app/uploads
      - SESSION_SECRET=${SESSION_SECRET:-change-this-in-production-random-secret-key-32-chars}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@votre-domaine.com}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
